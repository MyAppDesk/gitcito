name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    # 'true' when the macOS signing cert secret is configured. Drives whether the
    # mac build is signed + notarized or shipped unsigned. See docs/code-signing-macos.md.
    env:
      HAS_APPLE_CERT: ${{ secrets.CSC_LINK != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder 24.13.3 creates a temp keychain with a random
      # password, then calls `security set-key-partition-list -k` with the
      # .p12 password instead (electron-builder#10066). macos-26 rejects
      # that. Import the cert ourselves and keep CSC_LINK unset so builder
      # only finds the identity already in the keychain.
      - name: Import signing cert
        if: matrix.os == 'macos-latest' && env.HAS_APPLE_CERT == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          P12_PASSWORD="$(printf '%s' "${CSC_KEY_PASSWORD:-}" | tr -d '\r\n')"
          export CERT_PATH
          python3 -c 'import os, base64; open(os.environ["CERT_PATH"], "wb").write(base64.b64decode(os.environ["CSC_LINK"]))'
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Developer ID Application'; then
            echo 'No Developer ID Application identity in the signing keychain'
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      # macOS WITH signing secrets -> signed + notarized.
      - name: Build and publish (signed macOS)
        if: matrix.os == 'macos-latest' && env.HAS_APPLE_CERT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_KEYCHAIN: ${{ env.CSC_KEYCHAIN }}
          KEYCHAIN_PASSWORD: ${{ env.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$CSC_KEYCHAIN"
          npm run release -- --config.mac.notarize.teamId="$APPLE_TEAM_ID" --config.forceCodeSigning=true

      # Everything else: unsigned macOS (no secrets), or Windows/Linux.
      # CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder from failing
      # when no signing identity is present (harmless on Windows/Linux).
      - name: Build and publish (unsigned)
        if: matrix.os != 'macos-latest' || env.HAS_APPLE_CERT != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run release

  # Flip the draft release to published, but ONLY after all three build jobs
  # succeed. If any OS build fails, this job is skipped and the release stays a
  # hidden draft (no half-uploaded release ever goes public).
  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog for this version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          # Write to a file (not a shell arg) so notes containing quotes,
          # backticks or $() never get re-interpreted by the shell.
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md \
            | sed '/^$/d' | head -100 > release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest \
            --notes-file release-notes.md
